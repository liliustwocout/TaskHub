version: '3.8'

services:
  web:
    build: .
    container_name: taskhub_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/taskhub_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkey_change_me_in_production_123456789
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: taskhub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taskhub_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
